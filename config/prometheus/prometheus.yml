# =============================================================================
# Prometheus — Scrape Config
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "trading-agent"
    static_configs:
      - targets: ["trading-agent:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
