# =============================================================================
# Trading Agent System — Global Configuration
# =============================================================================

# --- Exchanges ---
exchanges:
  binance:
    enable: true
    type: spot
    rate_limit: 1200  # requests per minute
  binance_futures:
    enable: true
    type: futures
    rate_limit: 1200
  bybit:
    enable: false
    type: spot
    rate_limit: 600
  okx:
    enable: false
    type: spot
    rate_limit: 600

# --- Data Collection ---
data:
  default_exchange: "binance"
  default_timeframe: "1h"
  storage: "parquet"            # parquet | csv | duckdb
  storage_path: "data/raw"
  batch_size: 1000              # candles per batch API call
  max_retries: 3
  retry_delay_sec: 5

  # Timeframes to collect
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "1h"
    - "4h"
    - "1d"

# --- Trading Pairs ---
# Format: exchange: [symbols]
symbols:
  binance:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "DOGE/USDT"
    - "ADA/USDT"
    - "XRP/USDT"
    - "DOT/USDT"
    - "AVAX/USDT"
    - "LINK/USDT"
  binance_futures:
    - "BTC/USDT:USDT"
    - "ETH/USDT:USDT"
    - "SOL/USDT:USDT"

# --- Backtest Defaults ---
backtest:
  initial_capital: 10000.0      # USD
  commission: 0.001              # 0.1%
  slippage: 0.0005              # 0.05%
  output_path: "data/processed"

# --- LLM (for Phase 2+) ---
# Priority: opencode / nvidia / openrouter / ollama
llm:
  provider: "opencode"          # OpenCode Zen — free, no API key needed
  model: "deepseek-v4-flash-free"  # Free tier, cost = $0
  temperature: 0.1
  max_tokens: 2000

  # Model fallback WITHIN OpenCode (tried before switching provider)
  model_fallback:
    - "mimo-v2.5-free"
    - "laguna-s-2.1-free"
    - "ling-3.0-flash-free"
    - "nemotron-3-ultra-free"
    - "big-pickle"

  # Provider fallback chain (tries in order) — only providers with WORKING keys
  fallback:
    - provider: "nvidia"
      model: "meta/llama-3.2-3b-instruct"
    - provider: "openrouter"
      model: "nvidia/nemotron-3-ultra-550b-a55b:free"
    - provider: "ollama"
      model: "qwen2.5:7b"
      base_url: "http://localhost:11434/v1"

# --- Monitoring & Database ---
monitoring:
  database:
    enabled: true
    path: "data/trading.db"
  dashboard:
    port: 8501
    auto_refresh: 5        # seconds

# --- Alerting ---
alerts:
  console:
    enabled: true
  telegram:
    enabled: true
    # bot_token: set via TELEGRAM_BOT_TOKEN env
    # chat_id: set via TELEGRAM_CHAT_ID env

# --- Logging ---
logging:
  level: "INFO"                  # DEBUG | INFO | WARNING | ERROR
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  file: "logs/trading_agent.log"
