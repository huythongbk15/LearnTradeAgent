# =============================================================================
# Trading Agent System — Global Configuration (EXAMPLE)
# =============================================================================
# Copy this file to config.yaml and adjust values as needed.
# All secrets (API keys, tokens) MUST be set via environment variables or .env file,
# NOT in this YAML file. See .env.example for the required environment variables.
#
# This config is loaded by trading_agent.config.loader.Config singleton.
# Access via: from trading_agent.config.loader import config
# =============================================================================

# --- Exchanges ---
# Configure which exchanges to enable. Each exchange has:
#   - enable: true/false
#   - type: spot | futures
#   - rate_limit: requests per minute (respect exchange limits)
exchanges:
  binance:
    enable: true
    type: spot
    rate_limit: 1200
  binance_futures:
    enable: true
    type: futures
    rate_limit: 1200
  bybit:
    enable: false
    type: spot
    rate_limit: 600
  okx:
    enable: false
    type: spot
    rate_limit: 600

# --- Data Collection ---
data:
  default_exchange: "binance"
  default_timeframe: "1h"
  storage: "parquet"            # parquet | csv | duckdb
  storage_path: "data/raw"
  batch_size: 1000              # candles per batch API call
  max_retries: 3
  retry_delay_sec: 5

  # Timeframes to collect (must be supported by the exchange)
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "1h"
    - "4h"
    - "1d"

# --- Trading Pairs ---
# Format: exchange: [symbols]
# Symbols use CCXT unified format (e.g., "BTC/USDT" for spot, "BTC/USDT:USDT" for USDT-margined futures)
symbols:
  binance:
    - "BTC/USDT"
    - "ETH/USDT"
    - "SOL/USDT"
    - "BNB/USDT"
    - "DOGE/USDT"
    - "ADA/USDT"
    - "XRP/USDT"
    - "DOT/USDT"
    - "AVAX/USDT"
    - "LINK/USDT"
  binance_futures:
    - "BTC/USDT:USDT"
    - "ETH/USDT:USDT"
    - "SOL/USDT:USDT"

# --- Backtest Defaults ---
backtest:
  initial_capital: 10000.0      # USD
  commission: 0.001              # 0.1% per trade
  slippage: 0.0005              # 0.05% per trade
  output_path: "data/processed"

# --- LLM Configuration (Phase 2+ agents) ---
# Priority order: opencode → nvidia → openrouter → ollama
# opencode: free, no API key required (RECOMMENDED)
# nvidia: free tier, requires NVIDIA_API_KEY
# openrouter: free tier, requires OPENROUTER_API_KEY
# ollama: local, requires running ollama server
llm:
  provider: "opencode"          # OpenCode Zen — free, no API key needed
  model: "deepseek-v4-flash-free"  # Free tier, cost = $0
  temperature: 0.1
  max_tokens: 2000

  # Model fallback WITHIN OpenCode (tried before switching provider)
  # All free models on OpenCode
  model_fallback:
    - "mimo-v2.5-free"
    - "laguna-s-2.1-free"
    - "ling-3.0-flash-free"
    - "nemotron-3-ultra-free"
    - "big-pickle"

  # Provider fallback chain (tried in order) — only providers with WORKING keys
  fallback:
    - provider: "nvidia"
      model: "meta/llama-3.2-3b-instruct"
    - provider: "openrouter"
      model: "nvidia/nemotron-3-ultra-550b-a55b:free"
    - provider: "ollama"
      model: "qwen2.5:7b"
      base_url: "http://localhost:11434/v1"

# --- Monitoring & Database ---
monitoring:
  database:
    enabled: true
    path: "data/trading.db"
  dashboard:
    port: 8501
    auto_refresh: 5        # seconds

# --- Alerting ---
alerts:
  console:
    enabled: true
  telegram:
    enabled: true
    # bot_token: set via TELEGRAM_BOT_TOKEN env var
    # chat_id: set via TELEGRAM_CHAT_ID env var

# --- Logging ---
logging:
  level: "INFO"                  # DEBUG | INFO | WARNING | ERROR
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  file: "logs/trading_agent.log"

# =============================================================================
# REQUIRED ENVIRONMENT VARIABLES (set in .env file or shell)
# =============================================================================
# Alpaca Paper Trading (for live paper execution):
#   ALPACA_API_KEY=your_api_key
#   ALPACA_API_SECRET=your_secret
#
# Binance Testnet (for testnet execution):
#   BINANCE_TESTNET_API_KEY=your_testnet_key
#   BINANCE_TESTNET_API_SECRET=your_testnet_secret
#
# Binance Mainnet (NOT RECOMMENDED - mainnet is NO-GO):
#   BINANCE_API_KEY=your_api_key
#   BINANCE_API_SECRET=your_secret
#
# OANDA Forex (optional):
#   OANDA_API_KEY=your_api_key
#   OANDA_ACCOUNT_ID=your_account_id
#
# Telegram Alerts (optional but recommended):
#   TELEGRAM_BOT_TOKEN=your_bot_token
#   TELEGRAM_CHAT_ID=your_chat_id
#
# NVIDIA API (for LLM fallback):
#   NVIDIA_API_KEY=your_nvidia_key
#
# OpenRouter API (for LLM fallback):
#   OPENROUTER_API_KEY=your_openrouter_key
#
# Live Trading Safety (REQUIRED for paper execution):
#   TRADING_EXECUTION_ENABLED=true
#   TRADING_MODE=paper
#
# =============================================================================
# MAINNET STATUS: NO-GO
# =============================================================================
# This system is NOT certified for real-money trading.
# Deploy with TRADING_MODE=paper only.
# Mainnet requires: 30-day testnet soak, 100+ order lifecycles, zero unexplained failures.
# See docs/LIVE_TRADING_TODO.md for acceptance gates.
# =============================================================================