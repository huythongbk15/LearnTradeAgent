# .github/workflows/provenance-gate.yml — Supply-chain provenance enforcement
# (Wave E).  Runs whenever CI finishes on master and verifies the produced
# image against ALL rejection criteria from §23: repository, commit, workflow,
# branch, SBOM, signature, provenance attestation.
#
# This gate does NOT deploy.  It is the independent audit before any deploy:
# * staging CD continues to run its own verify steps;
# * production dispatch must ONLY be performed when this gate is green for
#   the target commit (documented in docs/PRODUCTION_POLICY.md).

name: Provenance Gate

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  provenance-gate:
    name: Verify provenance before deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image to gate
        run: |
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          SHA_TAG="$REGISTRY/$REPOSITORY:sha-$HEAD_SHA"
          docker pull "$SHA_TAG"
          DIGEST_IMAGE="$(docker image inspect --format='{{index .RepoDigests 0}}' "$SHA_TAG")"
          case "$DIGEST_IMAGE" in
            *@sha256:*) ;;
            *) echo "Registry did not return an immutable digest" >&2; exit 1 ;;
          esac
          echo "image=$DIGEST_IMAGE" >> "$GITHUB_ENV"

      - name: Run provenance verifier (all 7 criteria)
        continue-on-error: true
        run: |
          python scripts/verify_provenance.py \
            --image "$image" \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$HEAD_SHA" \
            --workflow .github/workflows/ci.yml \
            --ref refs/heads/master