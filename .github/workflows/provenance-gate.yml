# .github/workflows/provenance-gate.yml — Supply-chain provenance enforcement
# (Wave E).  Runs whenever CI finishes on master and verifies the produced
# image against ALL rejection criteria from §23: repository, commit, workflow,
# branch, SBOM, signature, provenance attestation.
#
# This gate does NOT deploy.  It is the independent audit before any deploy:
# * staging CD starts only after this gate succeeds and repeats verification;
# * production dispatch must ONLY be performed when this gate is green for
#   the target commit (documented in docs/PRODUCTION_POLICY.md).

name: Provenance Gate

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: read
  attestations: read
  actions: read

jobs:
  provenance-gate:
    name: Verify provenance before deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Check supply-chain verifier versions
        run: |
          cosign version
          gh version

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image to gate
        run: |
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          SHA_TAG="$REGISTRY/$REPOSITORY:sha-$HEAD_SHA"
          docker pull "$SHA_TAG"
          DIGEST_IMAGE="$(docker image inspect --format='{{index .RepoDigests 0}}' "$SHA_TAG")"
          case "$DIGEST_IMAGE" in
            *@sha256:*) ;;
            *) echo "Registry did not return an immutable digest" >&2; exit 1 ;;
          esac
          echo "image=$DIGEST_IMAGE" >> "$GITHUB_ENV"

      - name: Run provenance verifier (all 7 criteria)
        run: |
          python scripts/verify_provenance.py \
            --image "$image" \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$HEAD_SHA" \
            --workflow .github/workflows/ci.yml \
            --ref refs/heads/master

      - name: Record immutable provenance verdict
        run: |
          mkdir -p provenance-verdict
          printf '%s\n' "$HEAD_SHA" > provenance-verdict/head-sha.txt
          printf '%s\n' "$image" > provenance-verdict/image-ref.txt

      - name: Upload immutable provenance verdict
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-verdict
          path: provenance-verdict/
          if-no-files-found: error
          retention-days: 7
