name: Phase 6 Multi-Region & Integration

on:
  push:
    branches: [master]
    paths:
      - 'src/trading_agent/**'
      - 'tests/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'src/trading_agent/**'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  integration:
    name: Integration Tests (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev,web,infra,ml,research,portfolio]"
          pip install pytest

      - name: Run full test suite
        run: |
          python -m pytest tests/ -q

      - name: Verify multi-region dry-run (no cluster)
        run: |
          timeout 15 python -m trading_agent.infrastructure.multi_region.sync_controller dryrun

      - name: Verify chaos dry-run (no cluster)
        run: |
          python scripts/chaos_dryrun.py | head -20

  loadtest:
    name: Load Tests (quick)
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e ".[dev,web,infra,ml,research,portfolio]"
          pip install pytest

      - name: Run quick load tests
        run: |
          python scripts/load_test_phase6.py --quick

      - name: Run benchmarks
        run: |
          python scripts/benchmark_phase6.py

  multi-region-manifest:
    name: Validate Multi-Region Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e ".[dev,web,infra,ml,research,portfolio]"

      - name: Validate sync controller imports
        run: |
          python -c "from trading_agent.infrastructure.multi_region.sync_controller import RegionSyncController, RegionInfo, RegionRole, SyncPolicy; print('multi-region imports OK')"

      - name: Validate chaos imports
        run: |
          python -c "from trading_agent.infrastructure.chaos.chaos_experiments import ChaosExperimentSuite, ChaosExperimentType; print('chaos imports OK')"
