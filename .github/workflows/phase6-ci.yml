name: Phase 6 Multi-Region & Integration

on:
  push:
    branches: [master]
    paths:
      - 'src/trading_agent/**'
      - 'tests/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'src/trading_agent/**'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  integration:
    name: Integration Tests (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest

      - name: Run full test suite
        run: |
          python -m pytest tests/ -q

      - name: Verify multi-region dry-run (no cluster)
        run: |
          timeout 15 python -m trading_agent.infrastructure.multi_region.sync_controller dryrun

      - name: Verify chaos dry-run (no cluster)
        run: |
          python scripts/chaos_dryrun.py | head -20

  loadtest:
    name: Load Tests (quick)
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest

      - name: Run quick load tests
        run: |
          python scripts/load_test_phase6.py --quick

      - name: Run benchmarks
        run: |
          python scripts/benchmark_phase6.py

  multi-region-manifest:
    name: Validate Multi-Region Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Validate sync controller imports
        run: |
          python -c "from trading_agent.infrastructure.multi_region.sync_controller import RegionSyncController, RegionInfo, RegionRole, SyncPolicy; print('multi-region imports OK')"

      - name: Validate chaos imports
        run: |
          python -c "from trading_agent.infrastructure.chaos.chaos_experiments import ChaosExperimentSuite, ChaosExperimentType; print('chaos imports OK')"
