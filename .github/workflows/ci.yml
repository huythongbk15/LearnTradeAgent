# CI Pipeline — Lint, Type Check, Unit Tests, Security Scan (chạy trên GitHub runner, KHÔNG cần VPS)

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff pytest pytest-cov

      - name: Lint (ruff)
        run: ruff check .

      - name: Import smoke test
        run: |
          python -c "import trading_agent; from trading_agent.exchanges import WebSocketManager, HealthMonitor; from trading_agent.data import DataPipeline, DataPipeline; print('Imports OK')"

      - name: Unit tests
        run: pytest tests/ -v --tb=short

      - name: Critical live-trading coverage gate
        run: |
          pytest tests/test_live_safety.py tests/test_binance_live_runner.py tests/test_ccxt_order_filters.py \
            tests/test_live_broker_balances.py \
            --cov=trading_agent.execution.live_safety \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Validate YAML workflows
        run: |
          python3 -c "import pathlib, yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.yml')]" && echo "All YAML valid"

      - name: Validate Docker Compose manifests
        shell: bash
        env:
          TRADING_AGENT_IMAGE: ghcr.io/example/trading-agent@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WEBUI_API_KEY: ci-placeholder
          CADDY_PASSWORD_HASH: ci-placeholder
          LETSENCRYPT_EMAIL: ci@example.invalid
          DOMAIN_NAME: example.invalid
        run: |
          touch .env.local
          trap 'rm -f .env.local' EXIT
          docker compose --profile '*' -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.oracle.yml config --quiet

  build-and-scan:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Determine image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          load: true
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image runs
        run: |
          docker run --rm "${{ steps.image.outputs.name }}:sha-${{ github.sha }}" python -c "import trading_agent; print('Import OK')"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: 'image'
          scan-ref: '${{ steps.image.outputs.name }}:sha-${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          trivyignores: '.trivyignore'

      - name: Push scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: publish
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          docker push "$IMAGE"
          REPOSITORY_DIGEST="$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
          case "$REPOSITORY_DIGEST" in
            *@sha256:*) ;;
            *) echo "Registry did not return an immutable digest" >&2; exit 1 ;;
          esac
          echo "digest=${REPOSITORY_DIGEST#*@}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Generate SPDX SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Sign image and attach SBOM attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE"

      - name: Upload SBOM artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-and-scan]
    if: always()
    steps:
      - name: Check secrets presence
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "TELEGRAM_BOT_TOKEN: EMPTY"
          else
            echo "TELEGRAM_BOT_TOKEN: SET"
          fi
          if [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "TELEGRAM_CHAT_ID: EMPTY"
          else
            echo "TELEGRAM_CHAT_ID: SET"
          fi

      - name: Send result
        continue-on-error: true
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🤖 **CI ${{ job.status }}**
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
