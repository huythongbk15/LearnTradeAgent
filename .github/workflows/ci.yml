# CI Pipeline — Lint, Type Check, Unit Tests, Security Scan (chạy trên GitHub runner, KHÔNG cần VPS)

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Import smoke test
        run: |
          python -c "import trading_agent, trading; from trading.exchanges import WebSocketManager, HealthMonitor; from trading.data import DataPipeline; print('Imports OK')"

      - name: Unit tests
        run: pytest tests/ -v --tb=short

      - name: Validate YAML workflows
        run: |
          python3 -c "import yaml; [yaml.safe_load(open(f)) for f in ['.github/workflows/ci.yml']]" && echo "All YAML valid"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: trading-agent:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image runs
        run: |
          docker run --rm trading-agent:local python -c "import trading_agent; print('Import OK')"

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          scan-ref: 'trading-agent:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build, security-scan]
    if: always()
    steps:
      - name: Send result
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🤖 **CI ${{ job.status }}**
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}