# CI Pipeline — Lint, Type Check, Unit Tests, Security Scan (chạy trên GitHub runner, KHÔNG cần VPS)

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,infra,ml,research,portfolio]"

      - name: Dependency lock freshness (uv.lock + exported requirements.lock)
        run: |
          python -m pip install uv
          uv lock --check
          uv export --format requirements-txt --all-extras --no-dev --no-editable --no-emit-project -o /tmp/requirements.lock
          # Compare content (strip the 2-line generation header, which embeds
          # the output path and legitimately differs between CI and repo).
          diff -u <(tail -n +3 requirements.lock) <(tail -n +3 /tmp/requirements.lock)

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check execution safety boundary
        run: mypy

      - name: Canonical execution P0 smoke gate
        run: python smoke_p0.py

      - name: Generated docs not stale
        run: |
          python scripts/generate_project_map.py --check

      - name: Check markdown links (local)
        run: |
          python scripts/check_md_links.py --check

      - name: Import smoke test
        run: |
          python -c "import trading_agent; from trading_agent.exchanges import WebSocketManager, HealthMonitor; from trading_agent.data import DataPipeline, DataPipeline; print('Imports OK')"

      - name: Unit tests
        run: pytest tests/ -v --tb=short

      - name: Critical live-trading coverage gate
        run: |
          pytest tests/test_live_safety.py tests/test_binance_live_runner.py tests/test_ccxt_order_filters.py \
            tests/test_live_broker_balances.py \
            --cov=trading_agent.execution.live_safety \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Validate YAML workflows
        run: |
          python3 -c "import pathlib, yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.yml')]" && echo "All YAML valid"

      - name: Validate Docker Compose manifests
        shell: bash
        env:
          TRADING_AGENT_IMAGE: ghcr.io/example/trading-agent@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WEBUI_API_KEY: ci-placeholder
          CADDY_PASSWORD_HASH: ci-placeholder
          LETSENCRYPT_EMAIL: ci@example.invalid
          DOMAIN_NAME: example.invalid
        run: |
          touch .env.local
          trap 'rm -f .env.local' EXIT
          docker compose --profile '*' -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.oracle.yml config --quiet

  build-and-scan:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Determine image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          push: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          load: true
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image runs (container smoke test)
        run: |
          IMAGE="${{ steps.image.outputs.name }}:sha-${{ github.sha }}"
          # CLI help exits 0
          docker run --rm "$IMAGE" --help >/dev/null
          # Package importable
          docker run --rm --entrypoint python "$IMAGE" -c "import trading_agent; print('Import OK')"
          # Health command executes; rc=1 expected when infra deps absent
          docker run --rm "$IMAGE" system health >/dev/null 2>&1 || rc=$?
          if [ -n "${rc:-}" ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi
          echo "health executed (rc=${rc:-0})"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          scan-ref: '${{ steps.image.outputs.name }}:sha-${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          trivyignores: '.trivyignore'

      - name: Push scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: publish
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          docker push "$IMAGE"
          REPOSITORY_DIGEST="$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
          case "$REPOSITORY_DIGEST" in
            *@sha256:*) ;;
            *) echo "Registry did not return an immutable digest" >&2; exit 1 ;;
          esac
          echo "digest=${REPOSITORY_DIGEST#*@}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Check cosign version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cosign version

      - name: Generate SPDX SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Sign image and attach SBOM attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$IMAGE"

      - name: Attach SLSA provenance attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}
        run: |
          # SLSA v0.2 provenance predicate binding this artifact to the exact
          # repo / commit / workflow / branch that produced it.  The deploy
          # gate (scripts/verify_provenance.py) rejects any artifact whose
          # predicate does not match the expected values.
          # NOTE: github.sha is a 40-char SHA-1 commit id, so it goes into
          # configSource.digest.sha1 (not sha256). completeness is a boolean
          # map per SLSA v0.2; we mark materials/environment as complete.
          cat > provenance.json <<EOF
          {
            "_type": "https://in-toto.io/Statement/v0.1",
            "subject": [{ "name": "${{ steps.image.outputs.name }}@${{ steps.publish.outputs.digest }}", "digest": { "sha256": "${{ steps.publish.outputs.digest }}" } }],
            "predicateType": "https://slsa.dev/provenance/v0.2",
            "predicate": {
              "builder": { "id": "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/master" },
              "buildType": "https://github.com/${{ github.repository }}/ci-build@v1",
              "metadata": {
                "completeness": { "parameters": false, "environment": false, "materials": true },
                "reproducible": false
              },
              "invocation": {
                "configSource": {
                  "uri": "git+https://github.com/${{ github.repository }}@${{ github.sha }}",
                  "digest": { "sha1": "${{ github.sha }}" }
                }
              }
            }
          }
          EOF
          # cosign v3.1.3+ supports --bundle for attest command
          cosign attest --yes --bundle provenance.bundle --predicate provenance.json --type slsaprovenance "$IMAGE"

      - name: Upload SBOM artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-and-scan]
    if: always()
    steps:
      - name: Check secrets presence
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "TELEGRAM_BOT_TOKEN: EMPTY"
          else
            echo "TELEGRAM_BOT_TOKEN: SET"
          fi
          if [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "TELEGRAM_CHAT_ID: EMPTY"
          else
            echo "TELEGRAM_CHAT_ID: SET"
          fi

      - name: Send result
        continue-on-error: true
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🤖 **CI ${{ job.status }}**
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
