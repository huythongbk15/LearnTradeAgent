# .github/workflows/cd-staging.yml — Continuous Deployment to Staging
# Triggers: Provenance Gate completes successfully on master branch

name: CD Staging

on:
  workflow_run:
    workflows: ["Provenance Gate"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: read
  attestations: read
  actions: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download immutable provenance verdict
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-verdict
          path: provenance-verdict
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate immutable provenance verdict
        id: verdict
        shell: bash
        run: |
          HEAD_SHA="$(tr -d '\r\n' < provenance-verdict/head-sha.txt)"
          IMAGE="$(tr -d '\r\n' < provenance-verdict/image-ref.txt)"
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Provenance verdict contains an invalid commit SHA" >&2
            exit 1
          fi
          if [[ ! "$IMAGE" =~ ^ghcr\.io/$REPOSITORY@sha256:[0-9a-f]{64}$ ]]; then
            echo "Provenance verdict contains an invalid image digest" >&2
            exit 1
          fi
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.verdict.outputs.head_sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # VERIFY ALL PROVENANCE CRITERIA AGAIN BEFORE DEPLOY
      # =========================================================================
      - name: Pull exact image from provenance verdict
        id: image-tag
        shell: bash
        run: |
          IMAGE="${{ steps.verdict.outputs.image }}"
          docker pull "$IMAGE"
          REVISION="$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")"
          if [ "$REVISION" != "${{ steps.verdict.outputs.head_sha }}" ]; then
            echo "Image revision label does not match the provenance verdict" >&2
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Using immutable image: $IMAGE"

      - name: Run provenance verifier (all 7 criteria)
        run: |
          python scripts/verify_provenance.py \
            --image "${{ steps.image-tag.outputs.image }}" \
            --repo "$GITHUB_REPOSITORY" \
            --commit "${{ steps.verdict.outputs.head_sha }}" \
            --workflow .github/workflows/ci.yml \
            --ref refs/heads/master

      # =========================================================================
      # DEPLOY TO STAGING (only after signature, SBOM, and SLSA verified)
      # =========================================================================
      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Configure SSH host verification
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to staging
        run: |
          IMAGE="${{ steps.image-tag.outputs.image }}"
          ssh ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} "
            set -e
            cd /opt/trading-agent-staging
            # Pin deployment to the exact image that passed full provenance verification.
            echo 'TRADING_AGENT_IMAGE=${{ steps.image-tag.outputs.image }}' > .env.image
            chmod 600 .env.image
            # Pull the pinned image (lite cron model — nothing runs persistently).
            docker compose --env-file .env.image -f docker-compose.yml -f docker-compose.lite.yml pull
            # Smoke test on the pinned image; container exits by itself.
            # system health may warn about optional infra (redis/timescale absent
            # in the lite profile) — tolerated here; real gate is the hourly cron.
            docker compose --env-file .env.image -f docker-compose.yml -f docker-compose.lite.yml \
              run --rm trading-agent python -m trading_agent.cli system health \
              || echo '⚠️ health reported warnings (tolerated in lite profile)'
            echo '✅ Staging image deployed (cron model — host cron triggers hourly runs)'
          "

      - name: Notify on success
        if: success()
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 **Staging Deployed & Verified**
            Commit: ${{ steps.verdict.outputs.head_sha }}
            Image: ${{ steps.image-tag.outputs.image }}
            ✅ Cosign signature verified
            ✅ GitHub SPDX SBOM attestation verified
            ✅ GitHub SLSA v1 provenance verified
            URL: https://staging.trading-agent.example.com

      - name: Notify on failure
        if: failure()
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ **Staging Deployment FAILED**
            Commit: ${{ steps.verdict.outputs.head_sha }}
            Run: ${{ github.run_id }}
            Check GitHub Actions for details.
