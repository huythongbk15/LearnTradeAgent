# .github/workflows/cd-staging.yml — Continuous Deployment to Staging
# Triggers: CI workflow completes successfully on master branch

name: CD Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: read
  id-token: write
  attestations: read
  actions: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # STEP 6: VERIFY IMAGE SIGNATURE & SBOM BEFORE DEPLOY
      # =========================================================================
      - name: Determine image tag (SHA-based from CI)
        id: image-tag
        shell: bash
        run: |
          # CI pushes sha-<sha> tag
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          SHA_TAG="${{ env.REGISTRY }}/$REPOSITORY:sha-${{ github.event.workflow_run.head_sha }}"
          docker pull "$SHA_TAG"
          REVISION="$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$SHA_TAG")"
          if [ "$REVISION" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "Image revision label does not match the successful CI commit" >&2
            exit 1
          fi
          DIGEST_IMAGE="$(docker image inspect --format='{{index .RepoDigests 0}}' "$SHA_TAG")"
          case "$DIGEST_IMAGE" in
            *@sha256:*) ;;
            *) echo "Registry did not return an immutable digest" >&2; exit 1 ;;
          esac
          echo "image=$DIGEST_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Using immutable image: $DIGEST_IMAGE"

      - name: Verify cosign signature
        id: verify-signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE="${{ steps.image-tag.outputs.image }}"
          echo "Verifying signature for $IMAGE"
          if cosign verify "$IMAGE" \
            --certificate-identity="https://github.com/huythongbk15/LearnTradeAgent/.github/workflows/ci.yml@refs/heads/master" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"; then
            echo "✅ Signature verified"
            echo "verified=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Signature verification FAILED"
            echo "verified=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify signed SBOM attestation
        id: verify-sbom
        run: |
          IMAGE="${{ steps.image-tag.outputs.image }}"
          echo "Verifying SBOM for $IMAGE"
          if cosign verify-attestation "$IMAGE" --type=spdxjson \
            --certificate-identity="https://github.com/huythongbk15/LearnTradeAgent/.github/workflows/ci.yml@refs/heads/master" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            > verified-sbom-attestation.json; then
            echo "✅ SBOM verified"
            echo "verified=true" >> $GITHUB_OUTPUT
          else
            echo "❌ SBOM verification FAILED"
            echo "verified=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Download SBOM artifact (for record)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ github.event.workflow_run.head_sha }}
          path: ./sbom
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display SBOM summary
        if: always()
        run: |
          if [ -f ./sbom/sbom.spdx.json ]; then
            echo "=== SBOM Summary ==="
            jq '.packages | length' ./sbom/sbom.spdx.json | xargs -I{} echo "Total packages: {}"
          else
            echo "SBOM artifact missing"
            exit 1
          fi

      # =========================================================================
      # DEPLOY TO STAGING (only after signature & SBOM verified)
      # =========================================================================
      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Configure SSH host verification
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to staging
        run: |
          IMAGE="${{ steps.image-tag.outputs.image }}"
          ssh ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} "
            set -e
            cd /opt/trading-agent-staging
            # Pin deployment to the exact image that passed signature verification.
            echo 'TRADING_AGENT_IMAGE=${{ steps.image-tag.outputs.image }}' > .env.image
            chmod 600 .env.image
            # Pull latest images
            docker compose --env-file .env.image -f docker-compose.yml -f docker-compose.prod.yml pull
            # Rolling restart
            docker compose --env-file .env.image -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            # Wait for health checks
            sleep 30
            for i in {1..10}; do
              if docker compose --env-file .env.image -f docker-compose.yml -f docker-compose.prod.yml \
                  exec -T trading-agent python -m trading_agent.cli system health >/dev/null 2>&1; then
                echo \"✅ trading-agent is healthy\"
                break
              fi
              sleep 10
            done
            docker compose --env-file .env.image -f docker-compose.yml -f docker-compose.prod.yml \
              exec -T trading-agent python -m trading_agent.cli system health
            echo '✅ Staging deployment successful'
          "

      - name: Notify on success
        if: success()
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 **Staging Deployed & Verified**
            Commit: ${{ github.event.workflow_run.head_sha }}
            Image: ${{ steps.image-tag.outputs.image }}
            ✅ Cosign signature verified
            ✅ SBOM verified
            URL: https://staging.trading-agent.example.com

      - name: Notify on failure
        if: failure()
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ **Staging Deployment FAILED**
            Commit: ${{ github.event.workflow_run.head_sha }}
            Run: ${{ github.run_id }}
            Check GitHub Actions for details.
