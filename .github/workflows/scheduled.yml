# Scheduled Jobs — Nightly backtest, weekly optimization, daily backup (local)

name: Scheduled Jobs

on:
  schedule:
    - cron: '0 2 * * *'   # Nightly backtest at 02:00 UTC
    - cron: '0 3 * * 0'   # Weekly optimize at 03:00 UTC Sunday
    - cron: '0 4 * * *'   # Daily backup at 04:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run manually'
        required: true
        type: choice
        options:
          - nightly-backtest
          - weekly-optimize
          - daily-backup

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  STAGING_HOST: ${{ secrets.STAGING_HOST }}
  STAGING_USER: ${{ secrets.STAGING_USER }}

jobs:
  nightly-backtest:
    name: Nightly Backtest
    if: github.event_name == 'schedule' || github.event.inputs.job == 'nightly-backtest'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Pull latest image
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} "
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          "

      - name: Run backtest suite
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} "
            cd /opt/trading-agent-staging &&
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm \
              -e TRADING_CONFIG_PATH=/app/config/credentials.yaml \
              trading-agent backtest run ma_crossover BTC/USDT --timeframe 1h --days 730 &&
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm \
              -e TRADING_CONFIG_PATH=/app/config/credentials.yaml \
              trading-agent backtest run rsi_mean_reversion BTC/USDT --timeframe 1h --days 730 &&
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm \
              -e TRADING_CONFIG_PATH=/app/config/credentials.yaml \
              trading-agent backtest run bbands_breakout BTC/USDT --timeframe 1h --days 730
          "

      - name: Extract metrics & compare
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} "
            cd /opt/trading-agent-staging &&
            docker cp scripts/check_metrics.py trading-agent:/tmp/check_metrics.py 2>/dev/null || true &&
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm \
              -e TRADING_CONFIG_PATH=/app/config/credentials.yaml \
              trading-agent python3 /tmp/check_metrics.py
            rm -f /tmp/check_metrics.py
          " 2>/dev/null || echo 'Metrics table not yet available'

      - name: Notify results
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🌙 **Nightly Backtest ${{ job.status }}**
            Time: ${{ github.event.workflow_run.created_at || github.event.head_commit.timestamp }}
            Commit: ${{ github.sha }}
            View logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  weekly-optimize:
    name: Weekly Parameter Optimization
    if: github.event_name == 'schedule' || github.event.inputs.job == 'weekly-optimize'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Pull latest image
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} "
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          "

      - name: Run parameter sweep
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} "
            cd /opt/trading-agent-staging &&
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm \
              -e TRADING_CONFIG_PATH=/app/config/credentials.yaml \
              trading-agent python param_sweep.py \
                --strategies ma_crossover rsi_mean_reversion bbands_breakout \
                --symbols BTC/USDT ETH/USDT SOL/USDT \
                --timeframes 1h 4h \
                --train-days 730 --test-days 365 \
                --output /app/data/param_sweep_$(date +%Y%m%d).json
          "

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: param-sweep-results
          path: /tmp/param_sweep_*.json
          retention-days: 30

      - name: Notify results
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🔧 **Weekly Optimization ${{ job.status }}**
            Check param sweep results in GitHub Artifacts.
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  daily-backup:
    name: Daily Database Backup (Local)
    if: github.event_name == 'schedule' || github.event.inputs.job == 'daily-backup'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Run backup script on staging (local)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} "
            set -e
            DATE=\$(date +%Y%m%d_%H%M%S)
            BACKUP_DIR=/opt/trading-agent-backups/\$DATE
            mkdir -p \$BACKUP_DIR

            # 1. TimescaleDB dump (custom format)
            docker exec trading-timescaledb-1 pg_dump -U trading -Fc trading > \$BACKUP_DIR/timescaledb_\$DATE.dump

            # 2. Redis RDB snapshot
            docker exec trading-redis-1 redis-cli --rdb \$BACKUP_DIR/redis_\$DATE.rdb

            # 3. Config folder
            cp -r /opt/trading-agent-staging/config \$BACKUP_DIR/

            # 4. Keep only last 7 backups locally
            ls -dt /opt/trading-agent-backups/*/ | tail -n +8 | xargs rm -rf

            echo 'Backup saved to \$BACKUP_DIR'
            du -sh \$BACKUP_DIR
          "

      - name: Verify backup
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} "
            ls -la /opt/trading-agent-backups/ | tail -10
          "

      - name: Notify
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            💾 **Daily Backup ${{ job.status }}**
            Path: /opt/trading-agent-backups/YYYYMMDD_HHMMSS/
            Time: \$(date -u +"%Y-%m-%d %H:%M UTC")