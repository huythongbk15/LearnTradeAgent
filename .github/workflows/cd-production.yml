# .github/workflows/cd-production.yml — Continuous Deployment to Production
# Triggers: manual workflow_dispatch (requires approval via environment protection)
#
# Topology: single execution leader (docker-compose.prod.yml `trading-agent`).
# Blue/green multi-replica execution is intentionally NOT deployed until
# distributed lease + fencing + proven failover exist (P1.5 in
# docs/LIVE_TRADING_TODO.md). Deploying does NOT enable mainnet trading.

name: CD Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA to deploy (sha-<sha> tag from CI)'
        required: true
        type: string
permissions:
  contents: read
  packages: read
  id-token: write
  attestations: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production (Single Execution Leader)
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # VERIFY IMAGE SIGNATURE & SBOM BEFORE PRODUCTION DEPLOY
      # =========================================================================
      - name: Determine image tag
        id: image-tag
        shell: bash
        run: |
          if [[ ! "${{ github.event.inputs.sha }}" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "Input must be sha- followed by the full 40-character commit SHA" >&2
            exit 1
          fi
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          IMAGE_TAG="${{ env.REGISTRY }}/$REPOSITORY:${{ github.event.inputs.sha }}"
          docker pull "$IMAGE_TAG"
          REQUESTED_REVISION="${{ github.event.inputs.sha }}"
          REQUESTED_REVISION="${REQUESTED_REVISION#sha-}"
          REVISION="$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_TAG")"
          if [ "$REVISION" != "$REQUESTED_REVISION" ]; then
            echo "Image revision label does not match the requested commit" >&2
            exit 1
          fi
          DIGEST_IMAGE="$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")"
          case "$DIGEST_IMAGE" in
            *@sha256:*) ;;
            *) echo "Registry did not return an immutable digest" >&2; exit 1 ;;
          esac
          echo "image=$DIGEST_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Using immutable image: $DIGEST_IMAGE"

      - name: Verify cosign signature
        id: verify-signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE="${{ steps.image-tag.outputs.image }}"
          echo "Verifying signature for $IMAGE"
          if cosign verify "$IMAGE" \
            --certificate-identity="https://github.com/huythongbk15/LearnTradeAgent/.github/workflows/ci.yml@refs/heads/master" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"; then
            echo "✅ Signature verified"
            echo "verified=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Signature verification FAILED"
            echo "verified=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify signed SBOM attestation
        id: verify-sbom
        run: |
          IMAGE="${{ steps.image-tag.outputs.image }}"
          echo "Verifying SBOM for $IMAGE"
          if cosign verify-attestation "$IMAGE" --type=spdxjson \
            --certificate-identity="https://github.com/huythongbk15/LearnTradeAgent/.github/workflows/ci.yml@refs/heads/master" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            > verified-sbom-attestation.json; then
            echo "✅ SBOM verified"
            echo "verified=true" >> $GITHUB_OUTPUT
          else
            echo "❌ SBOM verification FAILED"
            echo "verified=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify SLSA provenance attestation
        id: verify-provenance
        run: |
          IMAGE="${{ steps.image-tag.outputs.image }}"
          echo "Verifying SLSA provenance for $IMAGE"
          if cosign verify-attestation "$IMAGE" --type=slsaprovenance \
            --certificate-identity="https://github.com/huythongbk15/LearnTradeAgent/.github/workflows/ci.yml@refs/heads/master" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            > verified-provenance-attestation.json; then
            echo "✅ SLSA provenance verified"
            echo "verified=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Provenance verification FAILED"
            echo "verified=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify target commit is on master history (branch/ref binding)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          SHA="${{ github.event.inputs.sha }}"
          SHA="${SHA#sha-}"
          COMPARE="https://api.github.com/repos/${{ github.repository }}/compare/master...$SHA"
          BODY="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "$COMPARE")" \
            || { echo "❌ commit $SHA not comparable with master (wrong repository?)" >&2; exit 1; }
          python3 - "$SHA" "$BODY" <<'PY'
          import json, sys
          sha, body = sys.argv[1], json.loads(sys.argv[2])
          merge_base = (body.get("merge_base_commit") or {}).get("sha", "")
          status = body.get("status", "")
          if sha == merge_base:
              print(f"✅ commit {sha} is on master history (merge-base = target)")
          else:
              print(f"❌ commit {sha} is NOT on master history (merge-base {merge_base}, status {status})")
              sys.exit(1)
          PY

      # =========================================================================
      # DEPLOY SINGLE EXECUTION LEADER (manual, digest-pinned)
      # =========================================================================
      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Configure SSH host verification
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to production (single leader)
        env:
          IMAGE: ${{ steps.image-tag.outputs.image }}
        run: |
          ssh ${{ env.PRODUCTION_USER }}@${{ env.PRODUCTION_HOST }} "
            set -e
            cd /opt/trading-agent-prod

            # Save the currently deployed digest for rollback.
            if [ -f .env.image ]; then
              cp .env.image .env.image.previous || true
            fi

            # Pin deployment to the exact image that passed signature verification.
            echo 'TRADING_AGENT_IMAGE=${{ steps.image-tag.outputs.image }}' > .env.image
            chmod 600 .env.image

            docker compose --env-file .env.image -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose --env-file .env.image -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for health checks.
            sleep 30
            for i in {1..10}; do
              if docker compose --env-file .env.image -f docker-compose.yml -f docker-compose.prod.yml \
                  exec -T trading-agent python -m trading_agent.cli system health >/dev/null 2>&1; then
                echo \"✅ trading-agent is healthy\"
                break
              fi
              sleep 10
            done
            docker compose --env-file .env.image -f docker-compose.yml -f docker-compose.prod.yml \
              exec -T trading-agent python -m trading_agent.cli system health

            echo '✅ Single-leader deployment successful'
            echo 'Rollback: restore .env.image.previous -> .env.image, then re-run compose up -d'
          "

      - name: Notify on success
        if: success()
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ **Production Deployed & Verified**
            SHA: ${{ github.event.inputs.sha }}
            Image: ${{ steps.image-tag.outputs.image }}
            ✅ Cosign signature verified
            ✅ SBOM verified
            ✅ Single execution leader healthy
            ⚠️ Mainnet trading remains NO-GO unless explicitly enabled by operator.

      - name: Notify on failure
        if: failure()
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ **Production Deployment FAILED**
            SHA: ${{ github.event.inputs.sha }}
            Run: ${{ github.run_id }}
            Check GitHub Actions for details.
