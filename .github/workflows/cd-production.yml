# .github/workflows/cd-production.yml — Continuous Deployment to Production
# Triggers: manual workflow_dispatch (requires approval via environment protection)

name: CD Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA to deploy (sha-<sha> tag from CI)'
        required: true
        type: string
permissions:
  contents: read
  packages: read
  id-token: write
  attestations: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production (Blue-Green)
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      BLUE_GREEN_ENABLED: ${{ secrets.BLUE_GREEN_ENABLED || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate declared blue-green topology
        shell: bash
        run: |
          for service in trading-agent-blue trading-agent-green; do
            if ! grep -Eq "^[[:space:]]{2}${service}:" docker-compose.prod.yml; then
              echo "Production deployment is blocked: missing Compose service ${service}" >&2
              exit 1
            fi
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # STEP 6: VERIFY IMAGE SIGNATURE & SBOM BEFORE PRODUCTION DEPLOY
      # =========================================================================
      - name: Determine image tag
        id: image-tag
        shell: bash
        run: |
          if [[ ! "${{ github.event.inputs.sha }}" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "Input must be sha- followed by the full 40-character commit SHA" >&2
            exit 1
          fi
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          IMAGE_TAG="${{ env.REGISTRY }}/$REPOSITORY:${{ github.event.inputs.sha }}"
          docker pull "$IMAGE_TAG"
          REQUESTED_REVISION="${{ github.event.inputs.sha }}"
          REQUESTED_REVISION="${REQUESTED_REVISION#sha-}"
          REVISION="$(docker image inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_TAG")"
          if [ "$REVISION" != "$REQUESTED_REVISION" ]; then
            echo "Image revision label does not match the requested commit" >&2
            exit 1
          fi
          DIGEST_IMAGE="$(docker image inspect --format='{{index .RepoDigests 0}}' "$IMAGE_TAG")"
          case "$DIGEST_IMAGE" in
            *@sha256:*) ;;
            *) echo "Registry did not return an immutable digest" >&2; exit 1 ;;
          esac
          echo "image=$DIGEST_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Using immutable image: $DIGEST_IMAGE"

      - name: Verify cosign signature
        id: verify-signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE="${{ steps.image-tag.outputs.image }}"
          echo "Verifying signature for $IMAGE"
          if cosign verify "$IMAGE" \
            --certificate-identity="https://github.com/huythongbk15/LearnTradeAgent/.github/workflows/ci.yml@refs/heads/master" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"; then
            echo "✅ Signature verified"
            echo "verified=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Signature verification FAILED"
            echo "verified=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify signed SBOM attestation
        id: verify-sbom
        run: |
          IMAGE="${{ steps.image-tag.outputs.image }}"
          echo "Verifying SBOM for $IMAGE"
          if cosign verify-attestation "$IMAGE" --type=spdxjson \
            --certificate-identity="https://github.com/huythongbk15/LearnTradeAgent/.github/workflows/ci.yml@refs/heads/master" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            > verified-sbom-attestation.json; then
            echo "✅ SBOM verified"
            echo "verified=true" >> $GITHUB_OUTPUT
          else
            echo "❌ SBOM verification FAILED"
            echo "verified=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # =========================================================================
      # BLUE-GREEN DEPLOY TO PRODUCTION
      # =========================================================================
      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Configure SSH host verification
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to production (Blue-Green)
        env:
          IMAGE: ${{ steps.image-tag.outputs.image }}
          BLUE_GREEN: ${{ env.BLUE_GREEN_ENABLED }}
        run: |
          ssh ${{ env.PRODUCTION_USER }}@${{ env.PRODUCTION_HOST }} "
            set -e
            cd /opt/trading-agent-prod

            # Determine active/inactive color
            if docker compose -f docker-compose.yml -f docker-compose.prod.yml ps --format '{{.Name}}' | grep -q 'trading-agent-blue'; then
              ACTIVE=blue
              INACTIVE=green
            else
              ACTIVE=green
              INACTIVE=blue
            fi

            echo \"Active: \$ACTIVE, Inactive: \$INACTIVE\"

            # Update inactive service with new image
            echo \"TRADING_AGENT_IMAGE=${{ steps.image-tag.outputs.image }}\" > .env.\$INACTIVE
            docker compose --env-file .env.\$INACTIVE -f docker-compose.yml -f docker-compose.prod.yml --profile \$INACTIVE pull
            docker compose --env-file .env.\$INACTIVE -f docker-compose.yml -f docker-compose.prod.yml --profile \$INACTIVE up -d

            # Wait for health checks
            echo \"Waiting for health checks on \$INACTIVE...\"
            sleep 30
            for i in {1..10}; do
              if curl -f http://localhost:808\${ACTIVE/blue/0/green/1}/healthz 2>/dev/null; then
                echo \"✅ \$INACTIVE is healthy\"
                break
              fi
              sleep 10
            done

            # Switch traffic (update nginx/load balancer)
            echo \"Switching traffic to \$INACTIVE...\"
            # Update nginx config or load balancer target
            sed -i \"s/\$ACTIVE/\$INACTIVE/g\" nginx.conf 2>/dev/null || true
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -s reload 2>/dev/null || true

            # Verify new active
            sleep 10
            curl -f http://localhost:8080/healthz || exit 1

            # Stop old version after grace period
            echo \"Stopping old \$ACTIVE...\" 
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile \$ACTIVE down

            echo '✅ Blue-Green deployment successful'
          "

      - name: Notify on success
        if: success()
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ **Production Deployed & Verified**
            SHA: ${{ github.event.inputs.sha }}
            Image: ${{ steps.image-tag.outputs.image }}
            ✅ Cosign signature verified
            ✅ SBOM verified
            ✅ Blue-Green switch complete
            URL: https://trading-agent.example.com

      - name: Notify on failure
        if: failure()
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ **Production Deployment FAILED**
            SHA: ${{ github.event.inputs.sha }}
            Run: ${{ github.run_id }}
            Check GitHub Actions for details.
