[project]
name = "trading-agent"
version = "0.1.0"
description = "Multi-Agent AI Crypto Trading System"
authors = [
    {name = "trading"}
]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ccxt (>=4.0)",
    "pandas (>=2.0)",
    "polars (>=1.43.2)",
    "pyarrow (>=15.0)",
    "numpy (>=1.26)",
    "rich (>=13.0)",
    "python-dotenv (>=1.0)",
    "click (>=8.0)",
    "typer (>=0.12,<1.0)",
    "httpx (>=0.27)",
    "pyyaml (>=6.0)",
    # ML/routing used by the core CLI (regime detection, portfolio, strategy marketplace)
    "scipy (>=1.11)",
    "scikit-learn (>=1.3)",
    "hmmlearn (>=0.3)",
]

[project.optional-dependencies]
# Web dashboard + Web UI backend (Streamlit / FastAPI). Not required for the core CLI.
web = [
    "streamlit (>=1.61.1,<2.0.0)",
    "fastapi (>=0.141.1,<1.0)",
    "pydantic (>=2.13.4,<3.0)",
    "uvicorn[standard] (>=0.52.1,<1.0)",
    "alpaca-py (>=0.42,<0.44)",
]
# Kubernetes multi-region / chaos tooling. Only needed when operating a cluster.
infra = [
    "kubernetes (>=28.0)",
]
# Development and test tooling.
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=5.0)",
    "ruff (>=0.6)",
    "hypothesis (>=6.100,<7.0)",
]


[tool.poetry]
packages = [{include = "trading_agent", from = "src"}]

[project.scripts]
trading-agent = "trading_agent.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Bộ lọc warning có chủ đích (P1 cleanup):
# - Deprecation của thư viện / Python stdlib — không phải bug dự án
# - SciPy/numpy cảnh báo phụ trợ mà code đã xử lý nan an toàn
filterwarnings = [
    "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated:DeprecationWarning",
    "ignore:websockets\\.legacy is deprecated:DeprecationWarning",
    "ignore::DeprecationWarning:hmmlearn\\.utils",
    "ignore:An input array is constant:RuntimeWarning",
    "ignore:Mean of empty slice:RuntimeWarning",
    "ignore:invalid value encountered in scalar divide:RuntimeWarning",
]

[tool.ruff]
# CI lint scope: real bugs (pyflakes) + syntax errors. Style rules (line
# length, import sorting, datetime tz, etc.) are intentionally not enforced
# here to keep `ruff check .` green on the existing codebase.
# Safety-critical modules (execution/exchanges/risk/live) get stricter rules
# incrementally — see [tool.ruff.lint.per-file-ignores].

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# F841 (unused variable) is harmless noise; cleaned incrementally.
# E402 is intentional in scripts/ (sys.path setup) and several modules (lazy imports).
ignore = ["F841", "E402"]
