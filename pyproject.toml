[project]
name = "trading-agent"
version = "0.1.0"
description = "Multi-Agent AI Crypto Trading System"
authors = [
    {name = "trading"}
]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ccxt (>=4.0)",
    "pandas (>=2.0)",
    "polars (>=1.43.2)",
    "pyarrow (>=15.0)",
    "numpy (>=1.26)",
    "rich (>=13.0)",
    "python-dotenv (>=1.0)",
    "click (>=8.0)",
    "typer (>=0.12,<1.0)",
    "httpx (>=0.27)",
    "pyyaml (>=6.0)",
]

[project.optional-dependencies]
# Core CLI — minimal deps for basic commands (status, reset, config)
core = []

# Web dashboard + Web UI backend (Streamlit / FastAPI). Not required for the core CLI.
web = [
    "streamlit (>=1.61.1,<2.0.0)",
    "fastapi (>=0.141.1,<1.0)",
    "pydantic (>=2.13.4,<3.0)",
    "uvicorn[standard] (>=0.52.1,<1.0)",
    "alpaca-py (>=0.42,<0.44)",
]

# Machine learning: regime detection, online learning, RL, meta-learning
ml = [
    "scipy (>=1.11)",
    "scikit-learn (>=1.3)",
    "hmmlearn (>=0.3)",
    "river (>=0.21,<1.0)",
]

# Alpha research pipeline: factor scanning, statistical hardening
research = [
    "scipy (>=1.11)",
    "scikit-learn (>=1.3)",
]

# Portfolio optimization: Black-Litterman, HRP, risk parity, Kelly
portfolio = [
    "scipy (>=1.11)",
    "scikit-learn (>=1.3)",
]

# Live trading on Binance/Alpaca/OANDA/CEX: exchange adapters + live broker
live-binance = [
    "alpaca-py (>=0.42,<0.44)",
    "ccxt (>=4.0)",
]

# Kubernetes multi-region / chaos tooling. Only needed when operating a cluster.
infra = [
    "kubernetes (>=28.0)",
]

# Development and test tooling.
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=5.0)",
    "ruff (>=0.6)",
    "mypy (>=1.11,<2.0)",
    "hypothesis (>=6.100,<7.0)",
]

# Meta extra: install everything for full functionality
all = [
    "trading-agent[web,ml,research,portfolio,live-binance,infra,dev]",
]


[project.scripts]
trading-agent = "trading_agent.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trading_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: integration cells hitting real market data (deselect with '-m \"not slow\"')",
]
# Bộ lọc warning có chủ đích (P1 cleanup):
# - Deprecation của thư viện / Python stdlib — không phải bug dự án
# - SciPy/numpy cảnh báo phụ trợ mà code đã xử lý nan an toàn
filterwarnings = [
    "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated:DeprecationWarning",
    "ignore:websockets\\.legacy is deprecated:DeprecationWarning",
    "ignore::DeprecationWarning:hmmlearn\\.utils",
    "ignore:An input array is constant:RuntimeWarning",
    "ignore:Mean of empty slice:RuntimeWarning",
    "ignore:invalid value encountered in scalar divide:RuntimeWarning",
]

[tool.mypy]
python_version = "3.12"
files = [
    "src/trading_agent/execution/canonical/broker_gateway.py",
    "src/trading_agent/execution/canonical/adapters.py",
    "src/trading_agent/execution/application.py",
    "src/trading_agent/execution/lifecycle/lifecycle.py",
    "src/trading_agent/execution/lifecycle/store.py",
    "src/trading_agent/execution/engine.py",
    "scripts/migrate_global_seq.py",
]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true

[tool.ruff]
# CI lint scope: real bugs (pyflakes) + syntax errors. Style rules (line
# length, import sorting, datetime tz, etc.) are intentionally not enforced
# here to keep `ruff check .` green on the existing codebase.
# Safety-critical modules (execution/exchanges/risk/live) get stricter rules
# incrementally — see [tool.ruff.lint.per-file-ignores].

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# F841 (unused variable) is harmless noise; cleaned incrementally.
# E402 is intentional in scripts/ (sys.path setup) and several modules (lazy imports).
ignore = ["F841", "E402"]

# Safety-critical modules: enforce F841 and E402 (no ignore)
[tool.ruff.lint.per-file-ignores]
"src/trading_agent/execution/**" = []
"src/trading_agent/exchanges/**" = []
"src/trading_agent/risk/**" = []
"scripts/live_*.py" = []
