[project]
name = "trading-agent"
version = "0.1.0"
description = "Multi-Agent AI Crypto Trading System"
authors = [
    {name = "trading"}
]
license = "MIT"
requires-python = "^3.12"
dependencies = [
    "ccxt (>=4.0)",
    "pandas (>=2.0)",
    "polars (>=1.0)",
    "pyarrow (>=15.0)",
    "rich (>=13.0)",
    "python-dotenv (>=1.0)",
    "click (>=8.0)",
    "httpx (>=0.27)",
    "pyyaml (>=6.0)"
]


[tool.poetry]
packages = [{include = "trading_agent", from = "src"}]

[tool.poetry.scripts]
trading-agent = "trading_agent.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
