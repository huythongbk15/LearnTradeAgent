[project]
name = "trading-agent"
version = "0.1.0"
description = "Multi-Agent AI Crypto Trading System"
authors = [
    {name = "trading"}
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ccxt (>=4.0)",
    "pandas (>=2.0)",
    "polars (>=1.0)",
    "pyarrow (>=15.0)",
    "rich (>=13.0)",
    "python-dotenv (>=1.0)",
    "click (>=8.0)",
    "httpx (>=0.27)",
    "pyyaml (>=6.0)",
    "streamlit (>=1.60.0,<2.0.0)",
    "scipy (>=1.11)",
    "scikit-learn (>=1.3)",
    "hmmlearn (>=0.3)",
    "kubernetes (>=28.0)"
]

[project.optional-dependencies]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]


[tool.poetry]
packages = [{include = "trading_agent", from = "src"}]

[tool.poetry.scripts]
trading-agent = "trading_agent.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.ruff]
# CI lint scope: real bugs (pyflakes) + syntax errors. Style rules (line
# length, import sorting, datetime tz, etc.) are intentionally not enforced
# here to keep `ruff check .` green on the existing codebase.

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# F841 (unused variable) is harmless noise; cleaned incrementally.
# E402 is intentional in scripts/ (sys.path setup) and several modules (lazy imports).
ignore = ["F841", "E402"]
