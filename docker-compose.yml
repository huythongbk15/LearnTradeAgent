# =============================================================================
# Trading Agent System — Docker Compose
# =============================================================================
# Infrastructure services for the trading system.
# Start with: docker compose up -d
# =============================================================================

services:
  # ── App (CLI tool — dùng docker compose run, không up -d) ────────────
  trading-agent:
    build:
      context: .
      target: runtime
    image: trading-agent:latest
    command: ["--help"]
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env.local          # secrets (gitignored)
    profiles:
      - app

  # ── TimescaleDB (time-series database for market data) ────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16@sha256:55c35227094ec8995ea835241572a1810f619214f1a4216e8dc74243c11f8565
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:-trading_secret}
      POSTGRES_DB: trading_market_data
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_market_data"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - infra

  # ── Redis (caching, rate limiting, pub/sub) ───────────────────────────
  redis:
    image: redis:7-alpine@sha256:9702d01c1f10c3ea9f48211b4362e44f154ff02d063e6f7268eba804059f53bf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    profiles:
      - infra

  # ── Grafana (dashboard + alerting) ──────────────────────────────────
  grafana:
    image: grafana/grafana:latest@sha256:e27e68cfd5795c1bea54950766078a02e84dfa3bafe0a4d0e5382f713dfd8e4e
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./config/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    restart: unless-stopped
    profiles:
      - infra

  # ── Prometheus (metrics collection) ────────────────────────────────
  prometheus:
    image: prom/prometheus:latest@sha256:1147c92841726a6fef55fe6124491d6f85480f8de204f7d420304ca5bbd0a8f7
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    profiles:
      - infra

volumes:
  timescaledb_data:
  redis_data:
  grafana_data:
  prometheus_data:
