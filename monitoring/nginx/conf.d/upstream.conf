# Upstream Configuration — Managed by Blue-Green Deploy Script
# This file is updated by the deployment pipeline to switch traffic

# Trading Agent API (3 replicas behind load balancer)
upstream trading-agent {
    least_conn;
    server trading-agent_1:8000 max_fails=3 fail_timeout=10s;
    server trading-agent_2:8000 max_fails=3 fail_timeout=10s;
    server trading-agent_3:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Grafana
upstream grafana {
    server grafana:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Prometheus
upstream prometheus {
    server prometheus:9090 max_fails=3 fail_timeout=10s;
}