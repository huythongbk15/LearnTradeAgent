{
  "apiVersion": 1,
  "datasources": [
    {
      "name": "Prometheus",
      "type": "prometheus",
      "url": "http://prometheus:9090",
      "access": "proxy",
      "isDefault": true,
      "editable": false,
      "jsonData": {
        "timeInterval": "15s",
        "queryTimeout": "60s"
      }
    },
    {
      "name": "Loki",
      "type": "loki",
      "url": "http://loki:3100",
      "access": "proxy",
      "editable": false,
      "jsonData": {
        "maxLines": 1000,
        "derivedFields": [
          {
            "name": "traceID",
            "matcherRegex": "traceID=([a-f0-9]+)",
            "url": "http://tempo:3200/tempo/trace/$${__value.raw}",
            "datasourceUid": "tempo"
          }
        ]
      }
    },
    {
      "name": "Tempo",
      "type": "tempo",
      "url": "http://tempo:3200",
      "access": "proxy",
      "editable": false,
      "jsonData": {
        "tracesToLogs": {
          "datasourceUid": "loki",
          "tags": ["job", "instance", "pod", "namespace"],
          "spanStartTimeShift": "1h",
          "spanEndTimeShift": "1h",
          "filterByTraceID": true,
          "filterBySpanID": true
        }
      }
    }
  ]
}